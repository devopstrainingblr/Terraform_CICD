
name: Terraform Deployment

on:
  push:
    branches:
      - main

permissions:
  id-token: write
  contents: read

jobs:
  terraform:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      # Step 1: Debug GitHub OIDC claims
      - name: Debug OIDC Claims
        uses: actions/github-script@v7
        with:
          script: |
            const token = await core.getIDToken('sts.amazonaws.com');

            const payload = JSON.parse(
              Buffer.from(token.split('.')[1], 'base64url').toString()
            );

            console.log("OIDC issuer:", payload.iss);
            console.log("OIDC audience:", payload.aud);
            console.log("OIDC subject:", payload.sub);

      # Step 2: Configure AWS credentials
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ap-south-1
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          role-session-name: GitHubActions
          retry-max-attempts: 3

      # Step 3: Verify AWS authentication
      - name: Verify AWS Identity
        run: aws sts get-caller-identity

      # Step 4: Terraform initialization
      - name: Terraform Initialisation
        run: terraform init

      # Step 5: Terraform formatting
      - name: Terraform Format
        run: terraform fmt -check -recursive

      # Step 6: Terraform validation
      - name: Terraform Validate
        run: terraform validate

      # Step 7: Terraform plan
      - name: Terraform Plan
        run: terraform plan -out=tfplan

      # Step 8: Terraform apply
      - name: Terraform Apply
        run: terraform apply -auto-approve tfplan